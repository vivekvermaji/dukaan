{"name":"fix","on":"push","permissions":{"contents":"write"},"jobs":{"fix":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"find . -path ./.git -prune -o -type f -regex \".*/[0-9]+-[^/]*\" -print | while read f; do git mv -f \"$f\" \"$(dirname \"$f\")/$(basename \"$f\" | sed -E \"s/^[0-9]+-//\")\"; done; git config user.name bot; git config user.email bot@users.noreply.github.com; git diff --cached --quiet || (git commit -m \"Fix file names\" && git push)"}]}}}
